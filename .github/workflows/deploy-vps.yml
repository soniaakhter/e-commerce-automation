name: Deploy Playwright Report to VPS

on:
  workflow_run:
    workflows:
      - Playwright Tests
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Download Playwright report
        uses: actions/download-artifact@v5
        with:
          name: playwright-report-cross-browser
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: playwright-report

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Validate SSH private key
        run: |
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          echo "SSH private key is valid"

      - name: Test VPS connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/deploy_key \
            "$VPS_USER@$VPS_HOST" \
            "echo 'SSH connection successful'"

      - name: Clear old Playwright report
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -i ~/.ssh/deploy_key \
            "$VPS_USER@$VPS_HOST" \
            "rm -rf /var/www/playwright-report/*"

      - name: Deploy latest Playwright report
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp \
            -o BatchMode=yes \
            -i ~/.ssh/deploy_key \
            -r playwright-report/. \
            "$VPS_USER@$VPS_HOST:/var/www/playwright-report/"

      - name: Verify deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -i ~/.ssh/deploy_key \
            "$VPS_USER@$VPS_HOST" \
            "test -f /var/www/playwright-report/index.html && echo 'Deployment successful'"