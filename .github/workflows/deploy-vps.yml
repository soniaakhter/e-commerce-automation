name: Deploy Playwright Report to VPS

on:
  workflow_run:
    workflows: ["Playwright Tests"]
    types:
      - completed

permissions:
  contents: read
  actions: read
  

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Download Playwright report
        uses: actions/download-artifact@v5
        with:
          name: playwright-report-cross-browser
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: playwright-report

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Test VPS connection
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo 'SSH connection successful'"

      - name: Clear old report
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "rm -rf /var/www/playwright-report/*"

      - name: Deploy latest report
        run: |
          scp -i ~/.ssh/deploy_key \
            -r playwright-report/. \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/playwright-report/"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "test -f /var/www/playwright-report/index.html && echo 'Deployment successful'"