- name: Configure SSH
  shell: bash
  run: |
    mkdir -p ~/.ssh

    echo "${{ secrets.VPS_SSH_KEY_B64 }}" \
      | base64 --decode \
      > ~/.ssh/deploy_key

    chmod 600 ~/.ssh/deploy_key

    ssh-keyscan -H "${{ secrets.VPS_HOST }}" \
      >> ~/.ssh/known_hosts

- name: Validate SSH private key
  run: |
    ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

- name: Test VPS connection
  run: |
    ssh \
      -o BatchMode=yes \
      -o ConnectTimeout=10 \
      -i ~/.ssh/deploy_key \
      "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
      "echo 'SSH connection successful'"

- name: Clear old report
  run: |
    ssh \
      -o BatchMode=yes \
      -i ~/.ssh/deploy_key \
      "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
      "rm -rf /var/www/playwright-report/*"

- name: Deploy latest report
  run: |
    scp \
      -o BatchMode=yes \
      -i ~/.ssh/deploy_key \
      -r playwright-report/. \
      "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/playwright-report/"