name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript quality check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check TypeScript
        run: npm run typecheck

  core-tests:
    name: API and Chromium suite
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      BASE_URL: ${{ vars.BASE_URL || 'https://automationexercise.com' }}
      API_BASE_URL: ${{ vars.API_BASE_URL || vars.BASE_URL || 'https://automationexercise.com' }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run API and Chromium tests
        run: npm run test:ci
      - name: Upload core Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-core
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload core debugging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-core
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  cross-browser-smoke:
    name: Firefox and WebKit smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      BASE_URL: ${{ vars.BASE_URL || 'https://automationexercise.com' }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit
      - name: Run cross-browser smoke tests
        run: npm run test:cross-browser:smoke
      - name: Upload cross-browser HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cross-browser
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload cross-browser debugging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-cross-browser
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
